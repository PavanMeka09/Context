services:
  # The AI Chat Application (Context)
  context:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: context-chat
    ports:
      - "3000:80"
    depends_on:
      companion-server:
        condition: service_healthy
      searxng:
        condition: service_started
    restart: unless-stopped
    networks:
      - context-network

  # High-Performance Companion Server Backend
  companion-server:
    build:
      context: .
      dockerfile: Dockerfile.companion
    container_name: companion-server
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - SEARXNG_URL=http://searxng:8080
      - CRAWLER_DAEMON_URL=http://crawler-service:8083
    volumes:
      - companion-data:/root/.context-ai
    depends_on:
      crawler-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - context-network

  # Persistent FastAPI Crawl4AI Daemon
  crawler-service:
    build:
      context: .
      dockerfile: Dockerfile.crawler
    container_name: context-crawler
    ports:
      - "8083:8083"
    environment:
      - CRAWLER_PORT=8083
      - CRAWLER_HOST=0.0.0.0
    restart: unless-stopped
    networks:
      - context-network

  # SearXNG Search Engine
  searxng:
    image: searxng/searxng:latest
    container_name: context-searxng
    ports:
      - "8082:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
    restart: unless-stopped
    networks:
      - context-network

volumes:
  companion-data:

networks:
  context-network:
    driver: bridge
